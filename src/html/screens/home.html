<section id="view-inicio" class="view" aria-label="Visão geral">
  <section
    id="openingBalanceSetup"
    class="opening-balance-setup"
    aria-labelledby="openingBalanceSetupTitle"
    hidden
  >
    <div>
      <h2 id="openingBalanceSetupTitle">Quanto você já tem em conta?</h2>
      <p>Defina seu saldo inicial para acompanhar o valor disponível.</p>
    </div>
    <button class="button primary" type="button" data-action="opening-balance">
      Definir saldo inicial
    </button>
  </section>
  <div id="summaryCards" class="summary-grid"></div>
  <section class="monthly-balance-panel" aria-labelledby="monthlyBalanceTitle">
    <div>
      <h2 id="monthlyBalanceTitle">Saldo do mês</h2>
      <p id="monthlyBalancePeriod" class="muted"></p>
    </div>
    <div class="monthly-balance-amount">
      <strong id="monthlyBalanceValue" class="money" aria-live="polite"></strong>
      <p id="monthlyBalanceFormula" class="muted"></p>
    </div>
  </section>
  <div class="home-grid">
    <section class="panel">
      <div class="panel-heading">
        <div>
          <span class="eyebrow">OLHE PARA FRENTE</span>
          <h2>Próximas contas</h2>
        </div>
        <a class="text-button" href="#contas">Ver todas <span data-icon="arrow-right"></span></a>
      </div>
      <div id="homeBills"></div>
    </section>
    <section class="panel">
      <div class="panel-heading">
        <div>
          <span class="eyebrow">SEU DIA A DIA</span>
          <h2>Últimos lançamentos</h2>
        </div>
        <a class="text-button" href="#lancamentos"
          >Ver todos <span data-icon="arrow-right"></span
        ></a>
      </div>
      <div id="homeTransactions"></div>
    </section>
  </div>
  <div id="homeInsight" class="insight-banner"></div>
</section>
